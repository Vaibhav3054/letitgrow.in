<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Let It Grow | Websites, SaaS Platforms & Custom Software Agency</title>
    <meta
      name="description"
      content="Let It Grow builds high-converting websites, scalable SaaS platforms, and custom business software tailored to help startups and businesses grow online."
    />
    <link rel="canonical" href="https://www.letitgrow.in/" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" content="#4facfe" />

    <!-- Open Graph / Social Sharing -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.letitgrow.in/" />
    <meta property="og:site_name" content="Let It Grow" />
    <meta property="og:title" content="Let It Grow | Websites, SaaS Platforms & Custom Software" />
    <meta
      property="og:description"
      content="Modern websites, multi-tenant SaaS platforms like Pathology Lab SaaS, and custom business software engineered in Bhopal, India."
    />
    <meta property="og:image" content="https://www.letitgrow.in/images/og-preview.png" />

    <!-- Twitter / X Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Let It Grow | Websites, SaaS Platforms & Custom Software" />
    <meta
      name="twitter:description"
      content="Modern websites, multi-tenant SaaS platforms, and tailored business software built to scale."
    />
    <meta name="twitter:image" content="https://www.letitgrow.in/images/og-preview.png" />

    <!-- Fonts: Montserrat & Poppins (matching brand typography) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Structured Data (LocalBusiness / Organization) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "ProfessionalService",
        "name": "Let It Grow",
        "url": "https://www.letitgrow.in",
        "logo": "https://www.letitgrow.in/favicon.svg",
        "description": "Web development, SaaS platforms, and custom business software engineering agency.",
        "email": "letitgrow.help@gmail.com",
        "address": {
          "@type": "PostalAddress",
          "addressLocality": "Bhopal",
          "addressRegion": "Madhya Pradesh",
          "addressCountry": "IN"
        },
        "areaServed": "IN"
      }
    </script>

    <!-- Prevent dark-mode flash on load -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('lig-theme');
          if (saved === 'dark') {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-slate-50 text-slate-900 antialiased dark:bg-[#0b1120] dark:text-slate-100">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
